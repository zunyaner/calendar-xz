<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#110303">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="肖战日历锁屏壁纸预览，测试版。">
  <title>锁屏预览 · 战日历</title>
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./css/widget.css">
</head>
<body>
  <div id="stage">
    <img id="bg" class="bg" alt="" draggable="false">
    <div class="veil"></div>
    <main class="content with-bar">
      <section class="when">
        <div id="date" class="date"></div>
        <div id="week" class="week"></div>
        <div id="lunar" class="lunar"></div>
        <div id="status" class="status" hidden></div>
      </section>
      <section class="lyric-card" id="lyric-card" role="button" aria-label="换一句" tabindex="0">
        <p class="lyric-line" id="lyric-line"></p>
        <p class="lyric-from" id="lyric-from"></p>
      </section>
    </main>
    <nav id="toolbar" class="toolbar" aria-label="预览工具">
      <p class="hint">再点空白处可隐藏按钮，方便截图</p>
      <div class="bar">
        <button type="button" id="btn-photo">换图</button>
        <button type="button" id="btn-quote">换一句</button>
        <a href="./">返回日历</a>
      </div>
    </nav>
  </div>
  <script src="./js/widget.js" defer></script>
</body>
</html>
